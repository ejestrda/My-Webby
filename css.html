
<!DOCTYPE html>
<html>
<head>
  <title>Click to Rate!</title>
</head>
<body>

  <h2>CAN U RATE MY SIMPLE WEBBYYY</h2>

  <button id="likeBtn">click to rate meh</button>
  <p>Lovelotz: <span id="likeCount">0</span></p>

  <script>
    let likes = 0;

    document.getElementById("likeBtn")
      .addEventListener("click", function() {
        likes++;
        document.getElementById("likeCount")
          .textContent = likes;
      });
  </script>

</body>
</html>

<script src="index.js"></script>
